<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spam Detector</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background-color: #f4f4f4; }
        .container { background: white; padding: 30px; border-radius: 10px; display: inline-block; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        textarea { width: 100%; height: 100px; padding: 10px; margin-bottom: 10px; }
        button { background-color: #28a745; color: white; padding: 10px 20px; border: none; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #218838; }
        .result { margin-top: 20px; font-weight: bold; font-size: 20px; }
        .spam { color: red; }
        .ham { color: green; }
    </style>
</head>
<body>

    <div class="container">
        <h1> SMS Spam Detector</h1>
        <form action="/predict" method="POST">
            <textarea name="message" placeholder="Type your message here..." required>{{ user_input }}</textarea>
            <br>
            <button type="submit">Check Message</button>
        </form>

        {% if prediction %}
        <div class="result">
            Prediction: 
            <span class="{% if prediction == 'Spam' %}spam{% else %}ham{% endif %}">
                {{ prediction }}
            </span>
        </div>
        {% endif %}
    </div>

</body>
</html>
